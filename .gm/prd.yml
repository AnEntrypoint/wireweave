- id: fix-gitignore-missing-tracked-exceptions
  subject: .gitignore's blanket .gm/* rule is missing negation exceptions for rs-learn.db, code-search/, prd.yml, next-step.md -- despite the file's own comment and AGENTS.md claiming these are tracked
  description: 'gitignore line 35 (.gm/*) blanket-ignores everything under .gm/ except what''s explicitly negated afterward -- currently only !.gm/memories/ is negated. But the very next comment line in .gitignore reads ''# tracked: .gm/rs-learn.db, .gm/code-search/, AGENTS.md, .gm/prd.yml, .gm/next-step.md'' and AGENTS.md''s own State section repeats the same claim (rs-learn.db, disciplines, and search index are tracked -- memory follows the codebase). Verified via git ls-files: NONE of .gm/rs-learn.db, .gm/code-search/, .gm/prd.yml, .gm/next-step.md are actually tracked in git -- the documented contract is false. This means the project''s learned-memory database, code-search index, PRD state, and phase-tracking file never actually get committed/pushed, so a fresh clone or a different machine starts with zero inherited project memory despite the explicit design intent that memory follows the codebase. Fix: add the missing negation lines (!.gm/rs-learn.db, !.gm/code-search/, !.gm/prd.yml, !.gm/next-step.md) to .gitignore, then git add + commit the now-unignored files so the documented contract becomes real.'
  route_family: state
  preconditions: .gitignore's own comment and AGENTS.md both assert these four paths are tracked; git ls-files proves none of them currently are.
  invariants: AGENTS.md, .gitignore's comments, and actual git-tracked state must agree -- a documented contract that is silently false is worse than no documentation.
  postconditions: git ls-files .gm/rs-learn.db .gm/code-search/ .gm/prd.yml .gm/next-step.md all return non-empty; .gitignore has the four negation lines; the files are committed and pushed.
  SESSION_ID: gm-1788172287135
  status: completed
  witness: Added !.gm/rs-learn.db, !.gm/code-search/, !.gm/prd.yml, !.gm/next-step.md negation lines to .gitignore. git add + commit landed .gm/rs-learn.db (368K), .gm/next-step.md, .gm/prd.yml as newly tracked (git ls-files now returns non-empty for all three; .gm/code-search/ has no negation-blocking issue but doesn't currently exist on disk to populate). Committed as c3ec40a, later rebased onto origin/main's newer history as 64e23b9, pushed and CI-verified green.
